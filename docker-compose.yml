services:
  api:
    build: .
    container_name: semantic-search-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: semantic-search-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
  uploads_data:
