services:
  api:
    build: .
    container_name: semantic-search-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
      - redis

  worker:
    build: .
    container_name: semantic-search-worker
    command: python -m celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: semantic-search-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: semantic-search-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  qdrant_storage:
